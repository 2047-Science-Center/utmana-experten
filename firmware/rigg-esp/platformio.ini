; Utmana experten — rigg-firmware. Samma biblioteks-söm som Eco Loco mellan.
; Prototyp: nodemcuv2 (ESP8266) eller esp32dev. Drift: esp32-s3 (PoE-kort —
; undvik W5500:s SPI-pinnar).

[env]
framework = arduino
monitor_speed = 115200
lib_deps =
    fastled/FastLED@^3.7.0
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.0.4

[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2

[env:esp32dev]
platform = espressif32
board = esp32dev

[env:esp32-s3]
platform = espressif32
board = esp32-s3-devkitc-1
