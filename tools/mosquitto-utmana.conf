# Prototyp-broker för Utmana experten. Två lyssnare:
#   1883 = vanlig MQTT (ESP32-firmware, hjärnan, mosquitto_pub/sub)
#   9001 = MQTT-over-WebSocket (webbläsar-appens MqttRig — ?mqtt=ws://host:9001)
# ÖPPEN, LAN-brett — ENDAST prototyp (anonym access). Lås ner i drift.
#
#   mosquitto -c tools/mosquitto-utmana.conf -v

listener 1883 0.0.0.0
allow_anonymous true

listener 9001 0.0.0.0
protocol websockets
allow_anonymous true
